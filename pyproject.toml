[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "mwpipe"
version = "1.1.0"
description = "Install a Nexus Mods collection for OpenMW and run delta_plugin, GOCoverify and Lumenaire."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # standard library only

[project.scripts]
mwpipe = "mwpipe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mwpipe"]  # includes src/mwpipe/data/*

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
