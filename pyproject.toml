[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "mwpipe"
version = "1.1.0"
description = "Install a Nexus Mods collection for OpenMW and run delta_plugin, GOCoverify and Lumenaire."
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []  # standard library only

[project.scripts]
mwpipe = "mwpipe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mwpipe"]  # includes src/mwpipe/data/*

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true

[tool.coverage.run]
source = ["src/mwpipe"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Errors and unused code only. Line length and style rules are not enforced.
select = ["E4", "E7", "E9", "F", "W6"]
