# Usage: ./mwpipe.sh run <collection-url>   (or: docker compose run --rm mwpipe run <url>)
# OpenMW's directories are mounted at the same location inside the container as on the host, so the
# paths written into openmw.cfg are valid for OpenMW on the host as well as for the tools in here.
# mwpipe's own files stay out of them: caches and state live in named Docker volumes, and the
# settings you edit are the files in ./config, mounted read-only.
name: mwpipe

services:
  mwpipe:
    build: .
    # Set MWPIPE_IMAGE=ghcr.io/<owner>/mwpipe:<tag> to use the published image instead of building locally.
    image: ${MWPIPE_IMAGE:-mwpipe:local}
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      OPENMW_DATA_DIR: ${OPENMW_DATA_DIR:?set OPENMW_DATA_DIR in .env}
      OPENMW_CONFIG_DIR: ${OPENMW_CONFIG_DIR:?set OPENMW_CONFIG_DIR in .env}
      MORROWIND_DATA_FILES: ${MORROWIND_DATA_FILES:-}
      DOWNLOADS_DIR: ${DOWNLOADS_DIR:-}           # default: the cache volume
      MWPIPE_COLLECTION: ${MWPIPE_COLLECTION:-}
      MWPIPE_OVERRIDES: /config/overrides.json
      RAYON_NUM_THREADS: ${RAYON_NUM_THREADS:-}   # set to 1 if delta_plugin runs out of memory
    volumes:
      - { type: bind, source: "${OPENMW_DATA_DIR}", target: "${OPENMW_DATA_DIR}" }
      - { type: bind, source: "${OPENMW_CONFIG_DIR}", target: "${OPENMW_CONFIG_DIR}" }
      - { type: volume, source: cache, target: /cache }   # downloads, hashes, mlox rules: safe to delete
      - { type: volume, source: state, target: /state }   # install state, backups, builds
    configs:
      - { source: overrides, target: /config/overrides.json }
      - { source: lumenaire, target: /config/lumenaire.toml }
    secrets: [nexus_api_key]
    # Hardening: nothing but the mounts is writable, no capabilities, no privilege escalation.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  cache:
  state:

configs:
  overrides:
    content: |
      {}
  lumenaire:
    content: |
      # Lumenaire settings, used unless <config dir>/lumenaire.toml exists (Docker: ./config/lumenaire.toml, a copy of this file).
      # Values carried over from the previous waza_lightfixes.cfg. Docs: https://modding-openmw.gitlab.io/lumenaire/
      disable_flickering = true

      [general]   # orange lights: torches, sconces
      hue = 0.62
      saturation = 0.8
      value = 0.57
      radius = 1.2

      [colored]
      hue = 1.0
      saturation = 0.9
      value = 0.7
      radius = 1.1

secrets:
  nexus_api_key:
    file: ${NEXUS_API_KEY_SECRET:-./secrets/nexus_api_key}  # leave empty to be prompted instead
